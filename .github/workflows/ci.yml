name: Secure CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:   # позволяет запускать вручную

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ghcr.io/slipanespi/file-storage-service/backend
  IMAGE_NAME_FRONTEND: ghcr.io/slipanespi/file-storage-service/frontend

jobs:
  # =============================================
  # СТАДИЯ 1 – PRE-COMMIT SECURITY
  # =============================================
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --verbose --no-git

  ruff-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: cd backend && ruff check .

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
        continue-on-error: true

  # =============================================
  # СТАДИЯ 2 – TEST
  # =============================================
  pytest-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: file_storage_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        command: server /data --console-address ":9001"
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:testpass@localhost:5432/file_storage_test
      SECRET_KEY: test-secret-key-for-ci
      MINIO_URL: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: files
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - run: cd backend && pytest --cov=app --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc --noEmit

  # =============================================
  # СТАДИЯ 3 – BUILD & PUSH IMAGES
  # =============================================
  build-backend:
    runs-on: ubuntu-latest
    needs: [pytest-backend, frontend-lint]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}, ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest

  build-frontend:
    runs-on: ubuntu-latest
    needs: [pytest-backend, frontend-lint]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}, ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:latest

  # =============================================
  # СТАДИЯ 4 – IMAGE SCAN (Trivy)
  # =============================================
  trivy-scan-backend:
    runs-on: ubuntu-latest
    needs: [build-backend]
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy on backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

  trivy-scan-frontend:
    runs-on: ubuntu-latest
    needs: [build-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy on frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

  # =============================================
  # СТАДИЯ 5 – DEPLOY TO KUBERNETES + DAST
  # =============================================
  deploy-test-and-scan:
    runs-on: ubuntu-latest
    needs: [trivy-scan-backend, trivy-scan-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: test-cluster
          wait: 120s

      - name: Install OPA Gatekeeper
        run: |
          kubectl apply -f https://raw.githubusercontent.com/open-policy-agent/gatekeeper/master/deploy/gatekeeper.yaml
          sleep 30
          kubectl wait --for=condition=ready pod -l gatekeeper.sh/system=yes --timeout=60s -n gatekeeper-system


      - name: Apply security policies
        run: |
          kubectl apply -f k8s/gatekeeper/constrainttemplate-privileged.yaml
          kubectl apply -f k8s/gatekeeper/constraint-privileged.yaml


      - name: Scan Kubernetes manifests (Checkov)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: k8s/
          framework: kubernetes
          soft_fail: true


      - name: Set image tags
        run: |
          sed -i "s|:latest|:${{ github.sha }}|g" k8s/*.yaml


      - name: Create namespace and secrets
        run: |
          kubectl create namespace file-storage-test --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic app-secrets \
            --namespace=file-storage-test \
            --from-literal=database-url="${{ secrets.DATABASE_URL }}" \
            --from-literal=secret-key="${{ secrets.SECRET_KEY }}" \
            --from-literal=minio-access-key="${{ secrets.MINIO_ACCESS_KEY }}" \
            --from-literal=minio-secret-key="${{ secrets.MINIO_SECRET_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -


      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/services.yaml
          kubectl rollout status deployment/backend -n file-storage-test --timeout=120s
          kubectl rollout status deployment/frontend -n file-storage-test --timeout=120s


      - name: Wait for backend and port-forward
        run: |
          kubectl port-forward -n file-storage-test svc/backend 8000:8000 &
          sleep 5
          for i in {1..30}; do
            if curl -f http://localhost:8000/health; then
              echo "Backend is healthy!"
              break
            fi
            sleep 2
          done
          true

      
      - name: Run OWASP ZAP Baseline Scan
        run: |
          chmod -R 777 ${{ github.workspace }}
          docker run --rm \
            -v ${{ github.workspace }}:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:8000 \
            -J report_json.json \
            -w report_md.md \
            -r report_html.html
        continue-on-error: true

  # =============================================
  # СТАДИЯ 7 – DEPLOY TO PRODUCTION (ручной запуск)
  # =============================================
  deploy-prod:
    runs-on: ubuntu-latest
    needs: [deploy-test-and-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production (placeholder)
        run: echo "Здесь будет команда деплоя, например kubectl apply -f k8s/ -n file-storage-prod"